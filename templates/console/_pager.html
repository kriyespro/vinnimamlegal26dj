{% if page.paginator.num_pages > 1 %}
  <nav class="mt-3 flex items-center justify-between gap-3 text-xs" aria-label="Pagination">
    {% if page.has_previous() %}<a class="db-btn db-btn-ghost" href="?{{ qs }}{% if qs %}&{% endif %}page={{ page.previous_page_number() }}">← Prev</a>{% else %}<span></span>{% endif %}
    <span class="text-slate-500">Page {{ page.number }} of {{ page.paginator.num_pages }} · {{ page.paginator.count }} total</span>
    {% if page.has_next() %}<a class="db-btn db-btn-ghost" href="?{{ qs }}{% if qs %}&{% endif %}page={{ page.next_page_number() }}">Next →</a>{% else %}<span></span>{% endif %}
  </nav>
{% endif %}
