<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Set New Password — VinnitaLegal</title>
  <meta name="robots" content="noindex"/>
  <link rel="preload" href="{{ url_for('static', filename='fonts/inter-latin-wght-normal.woff2') }}" as="font" type="font/woff2" crossorigin/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.min.css') }}"/>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}"/>
</head>
<body class="font-inter bg-slate-50 text-navy">
  <div class="min-h-screen hero-gradient flex items-center justify-center px-4 py-16">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-extrabold text-white mb-2">Set a new password</h1>
        <p class="text-white/65 text-sm">Choose a strong password of at least 10 characters.</p>
      </div>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="mb-4 rounded-xl px-4 py-3 text-sm font-medium {% if category == 'error' %}bg-red-50 text-red-700 border border-red-100{% else %}bg-green-50 text-green-700 border border-green-100{% endif %}">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      <div class="glass-card rounded-3xl p-7 shadow-2xl">
        <form method="post" class="space-y-4">{{ csrf_input }}
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5" for="password">New password</label>
            <input id="password" type="password" name="password" required minlength="10" autocomplete="new-password" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-royal/30 focus:border-royal"/>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5" for="confirm_password">Confirm new password</label>
            <input id="confirm_password" type="password" name="confirm_password" required minlength="10" autocomplete="new-password" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-royal/30 focus:border-royal"/>
          </div>
          <button type="submit" class="btn-primary w-full justify-center py-3">Update password</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
